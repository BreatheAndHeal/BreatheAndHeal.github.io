name: Historical secret scan

on:
  push:
    branches:
      - migration/cloudflare-staging

permissions:
  contents: read

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and Git history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            git --source=/repo --no-banner --redact=100 --report-format=json --report-path=/tmp/gitleaks-report.json
