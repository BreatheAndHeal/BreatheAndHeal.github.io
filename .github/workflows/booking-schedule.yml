name: Booking schedule checks

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  booking-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm test
